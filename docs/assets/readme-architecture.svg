<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">Lingqi Books system architecture / 零柒书境系统架构</title><desc id="desc">Browser UI stores progress locally. Worker APIs protect and route requests to source adapters. Selected public responses use edge cache. Optional externally hosted content services require separate configuration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#708461"/></marker><style>.h{font:600 23px 'Noto Sans CJK SC',Arial,sans-serif;fill:#293e30}.en{font:16px Arial,sans-serif;fill:#6a795e}.body{font:17px 'Noto Sans CJK SC',Arial,sans-serif;fill:#56604e}.edge{fill:none;stroke:#708461;stroke-width:2.5;marker-end:url(#arrow)}.label{font:15px Arial,sans-serif;fill:#718064}</style></defs><rect width="1440" height="1040" rx="24" fill="#f4f1e8"/><text x="52" y="58" class="h" style="font-size:32px">从发现到阅读 / From discovery to reading</text><text x="52" y="91" class="en">IMPLEMENTED REQUEST FLOW · OPTIONAL SERVICES ARE DASHED</text>
<rect x="52" y="126" width="820" height="150" rx="16" fill="#fffdf7" stroke="#c8cebd" /><text x="76" y="160" class="h">浏览器阅读空间</text><text x="76" y="186" class="en">React + TypeScript / Vinext</text><text x="76" y="218" class="body">发现 · 搜索 · 书架 · 阅读器</text><text x="76" y="242" class="body">Discovery • search • shelf • novel and manga readers</text>
<rect x="972" y="126" width="416" height="150" rx="16" fill="#fffdf7" stroke="#c8cebd" /><text x="996" y="160" class="h">本地数据</text><text x="996" y="186" class="en">Browser-only storage</text><text x="996" y="218" class="body">localStorage: shelf &amp; progress</text><text x="996" y="242" class="body">IndexedDB: imported TXT</text>
<path d="M872 201H972" class="edge"/><path d="M460 276V330" class="edge"/><text x="480" y="310" class="label">Same-origin requests</text>
<rect x="52" y="330" width="820" height="174" rx="16" fill="#e8eddc" stroke="#c8cebd" /><text x="76" y="364" class="h">Sites / Cloudflare Worker API</text><text x="76" y="390" class="en">/api/catalog · /api/reader-image · /api/content-image</text><text x="76" y="422" class="body">参数与来源校验 · 限流 · 并发和响应体预算</text><text x="76" y="446" class="body">Validation • rate limits • concurrency / body budgets</text><text x="76" y="470" class="body">错误隔离 · 超时 · 检索退避 / isolation • timeout • cooldown</text>
<rect x="972" y="330" width="416" height="174" rx="16" fill="#fffdf7" stroke="#c8cebd" /><text x="996" y="364" class="h">选择性公共缓存</text><text x="996" y="390" class="en">Bounded cache + Cache API</text><text x="996" y="422" class="body">Public catalogs: 90s at edge</text><text x="996" y="446" class="body">Selected public images: 5min</text><text x="996" y="470" class="body">No private / authenticated sharing</text>
<path d="M872 417H972" class="edge"/><path d="M460 504V558" class="edge"/>
<rect x="52" y="558" width="820" height="150" rx="16" fill="#fffdf7" stroke="#c8cebd" /><text x="76" y="592" class="h">来源适配层</text><text x="76" y="618" class="en">lib/books/*</text><text x="76" y="650" class="body">统一作品、章节、文本与图片数据</text><text x="76" y="674" class="body">Normalize works, chapters, text and image blocks</text>
<path d="M250 708V762" class="edge"/><path d="M670 708V735H1176V762" class="edge" style="stroke-dasharray:8 6"/>
<rect x="52" y="762" width="820" height="166" rx="16" fill="#e8eddc" stroke="#c8cebd" /><text x="76" y="796" class="h">外部来源</text><text x="76" y="822" class="en">Public APIs / web sources / permitted image hosts</text><text x="76" y="854" class="body">Bangumi: metadata only • MangaDex: manga</text><text x="76" y="878" class="body">Public-reading and web-novel adapters</text><text x="76" y="902" class="body">Availability and rights are source-specific</text>
<rect x="972" y="762" width="416" height="166" rx="16" fill="#f4e8dd" stroke="#b88a6e" stroke-dasharray="8 6"/><text x="996" y="796" class="h">可选外部内容服务</text><text x="996" y="822" class="en">Separate deployment + credentials</text><text x="996" y="854" class="body">Content bridge / LNReader host</text><text x="996" y="878" class="body">Suwayomi / Maki instances</text><text x="996" y="902" class="body">Not bundled as running services</text>
<text x="52" y="978" class="body">边界 / Boundaries: no account sync • local limits are not global DDoS protection • no arbitrary URL proxy</text><text x="52" y="1008" class="en">Architecture describes code paths, not a guarantee that every upstream source is currently reachable.</text></svg>