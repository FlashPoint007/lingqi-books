services:
  bridge:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Set a random token of at least 32 characters}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./plugins:/app/plugins:ro
      - ./data:/app/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
